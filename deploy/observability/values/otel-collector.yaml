mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

service:
  enabled: true
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

  processors:
    batch:

  exporters:
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
